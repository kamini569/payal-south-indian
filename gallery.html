<style>
:root{--g:#031b13;--g2:#082d20;--gold:#e0b63d;--gold2:#ffe08a;--cream:#fff7df}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Sans Gujarati";background:var(--g);color:var(--cream)}a{text-decoration:none;color:inherit}.container{width:min(92%,1180px);margin:auto}
.navbar{position:sticky;top:0;z-index:99;background:rgba(3,27,19,.95);backdrop-filter:blur(12px);border-bottom:1px solid #765e25}.nav{height:78px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;gap:10px;align-items:center}.logo-icon{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2)}.logo b{font:27px "Cormorant Garamond"}.logo small{display:block;font-size:8px;color:var(--gold2);letter-spacing:2px}.nav-links{display:flex;gap:24px;list-style:none}.nav-links a{font-size:12px;font-weight:700;color:#ddd6c5}.nav-links a:hover,.nav-links .active{color:var(--gold2)}.order-nav{border:1px solid var(--gold);padding:10px 16px;border-radius:30px}.menu-btn{display:none;background:none;border:1px solid var(--gold);color:var(--gold2);width:42px;height:42px;border-radius:7px;font-size:21px}
.hero{text-align:center;padding:90px 20px;background:radial-gradient(circle,rgba(224,182,61,.12),transparent 45%)}.label{color:var(--gold2);letter-spacing:3px;font-size:12px;font-weight:700}.title{font:clamp(50px,7vw,78px) "Cormorant Garamond";margin-top:10px}.title span{color:var(--gold2)}
.gallery{padding:70px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.photo{height:280px;overflow:hidden;border:1px solid rgba(224,182,61,.35);cursor:pointer;border-radius:5px}.photo img{width:100%;height:100%;object-fit:cover;transition:.5s}.photo:hover img{transform:scale(1.08)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:999;display:none;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox img{max-width:95%;max-height:90%;width:auto;border:1px solid var(--gold)}.close{position:absolute;right:25px;top:20px;color:white;font-size:35px;cursor:pointer}
footer{background:#02140d;border-top:1px solid #765e25;padding:35px;text-align:center;color:#777;font-size:11px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.nav-links{position:absolute;top:78px;left:0;right:0;background:#031b13;display:none;flex-direction:column;padding:15px 6%;gap:0}.nav-links.open{display:flex}.nav-links a{display:block;padding:13px 0}.menu-btn{display:block}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.photo{height:300px}}
</style>
</head>
<body>

<div class="lightbox" id="lightbox"><span class="close" id="close">×</span><img id="largeImage" src="" alt=""></div>

<footer>© <span id="year"></span> Payal South Indian</footer>

<script>
const b=document.getElementById("menuBtn"),n=document.getElementById("navLinks");b.onclick=()=>n.classList.toggle("open");
document.querySelectorAll(".nav-links a").forEach(a=>a.onclick=()=>n.classList.remove("open"));
const box=document.getElementById("lightbox"),large=document.getElementById("largeImage");
document.querySelectorAll(".photo img").forEach(img=>img.onclick=()=>{large.src=img.src;large.alt=img.alt;box.classList.add("open")});
document.getElementById("close").onclick=()=>box.classList.remove("open");
box.onclick=e=>{if(e.target===box)box.classList.remove("open")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")box.classList.remove("open")});
document.getElementById("year").textContent=new Date().getFullYear();
</script>
