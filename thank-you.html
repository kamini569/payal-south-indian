<style>
:root{--g:#063b23;--d:#021f12;--gold:#d5a72d;--gl:#f2cc58;--c:#fff8e9}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"DM Sans";background:var(--d);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
.container{width:min(92%,700px)}

.card{margin-top:35px;padding:60px 35px;border:1px solid #d5a72d66;background:#063b23}
.icon{width:80px;height:80px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;font-size:35px;color:var(--gl)}
h1{font-family:"Noto Sans Gujarati";font-size:clamp(38px,7vw,65px);margin:25px 0 10px}
p{color:#ffffffb8;line-height:1.8}
.buttons{margin-top:30px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{padding:15px 22px;font-size:11px;font-weight:700;letter-spacing:1px;background:var(--gold);color:var(--d)}
.outline{background:transparent;border:1px solid var(--gold);color:var(--gl)}
</style>
</head>
